<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="V&J">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><title>V&amp;J</title>
<style>
:root{--silver:#d5d7db;--muted:#92949a;--border:#303034}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 0%,#222326 0%,#0b0b0c 42%,#050505 80%);color:var(--silver);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{min-height:100svh;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}
.wrap{width:min(620px,100%);margin:0 auto;padding:clamp(48px,12vh,100px) 0 32px}
header{text-align:center;margin-bottom:42px}.monogram{font-size:clamp(48px,12vw,70px);font-weight:600;letter-spacing:3px;background:linear-gradient(180deg,#fff 0%,#c6c8cc 45%,#85888e 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.rule{width:56px;height:1px;background:#777;margin:19px auto 0}
.panel{background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.018));border:1px solid var(--border);border-radius:22px;padding:28px 20px 25px;box-shadow:0 24px 60px rgba(0,0,0,.32)}
.eyebrow{text-align:center;text-transform:uppercase;letter-spacing:2.3px;font-size:11px;color:#9a9ca1;margin-bottom:12px}
h1{text-align:center;font-size:20px;font-weight:500;letter-spacing:.2px;margin:0 0 9px;color:#e1e2e5}.date{text-align:center;color:var(--muted);font-size:13px;margin-bottom:28px}
.counter{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}.unit{min-width:0;text-align:center;background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.045);border-radius:13px;padding:15px 2px 12px}
.num{font-size:clamp(19px,4.8vw,28px);font-weight:550;letter-spacing:-.7px;font-variant-numeric:tabular-nums;white-space:nowrap}.label{font-size:10px;color:#96989d;text-transform:uppercase;letter-spacing:.7px;margin-top:7px}
.footer{text-align:center;font-size:10px;letter-spacing:1.7px;color:#606166;margin-top:26px}
@media(max-width:360px){.panel{padding:23px 10px}.counter{gap:4px}.num{font-size:18px}.label{font-size:9px;letter-spacing:.3px}}
</style></head><body><main class="wrap">
<header><div class="monogram">V&amp;J</div><div class="rule"></div></header>
<section class="panel" aria-label="Tiempo transcurrido desde la fecha">
<div class="eyebrow">Desde que nos conocimos</div><h1>Tiempo transcurrido</h1>
<div class="date">21 de mayo de 2026 · 20:45</div>
<div class="counter" id="counter">
<div class="unit"><div class="num">—</div><div class="label">Años</div></div>
<div class="unit"><div class="num">—</div><div class="label">Meses</div></div>
<div class="unit"><div class="num">—</div><div class="label">Días</div></div>
<div class="unit"><div class="num">—</div><div class="label">Horas</div></div>
<div class="unit"><div class="num">—</div><div class="label">Minutos</div></div>
<div class="unit"><div class="num">—</div><div class="label">Segundos</div></div>
</div></section><div class="footer">V&amp;J</div></main>
<script>
const start=new Date("2026-05-21T20:45:00+02:00");
function addMonths(date,months){const r=new Date(date),day=r.getDate();r.setDate(1);r.setMonth(r.getMonth()+months);const last=new Date(r.getFullYear(),r.getMonth()+1,0).getDate();r.setDate(Math.min(day,last));return r}
function elapsedParts(from,to){let years=to.getFullYear()-from.getFullYear(),cursor=addMonths(from,years*12);if(cursor>to){years--;cursor=addMonths(from,years*12)}
let months=(to.getFullYear()-cursor.getFullYear())*12+to.getMonth()-cursor.getMonth(),monthCursor=addMonths(cursor,months);if(monthCursor>to){months--;monthCursor=addMonths(cursor,months)}
let remaining=Math.max(0,to.getTime()-monthCursor.getTime()),days=Math.floor(remaining/86400000);remaining-=days*86400000;const hours=Math.floor(remaining/3600000);remaining-=hours*3600000;const minutes=Math.floor(remaining/60000);remaining-=minutes*60000;const seconds=Math.floor(remaining/1000);return[years,months,days,hours,minutes,seconds]}
function tick(){const values=elapsedParts(start,new Date());document.querySelectorAll("#counter .num").forEach((el,i)=>el.textContent=String(values[i]).padStart(2,"0"))}
tick();setInterval(tick,1000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick()});
</script></body></html>
